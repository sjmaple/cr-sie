[project]
name = "superlinked-sie-cost-routing-example"
version = "0.1.0"
description = "Compare embedding and reranker model routing, replay public evidence, and optimize prompts with GEPA on SIE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk==0.10.0",
  "numpy==2.4.6",
  "httpx>=0.28,<1",
]

[tool.uv]
package = false

# SIEClient() with only SIE_API_KEY set targets SIE Serverless from superlinked/sie#691,
# which is newer than the sie-sdk 0.10.0 release on PyPI.
[tool.uv.sources]
sie-sdk = { git = "https://github.com/superlinked/sie", rev = "d680237f02c2b67fd9afd91f30b73a29cb18fae0", subdirectory = "packages/sie_sdk" }

[dependency-groups]
gepa = ["gepa==0.1.4"]
data = ["pyarrow>=18,<24"]
dev = [
  "ruff>=0.14",
]
analysis = [
    "matplotlib>=3.10,<4",
]
grading = [
  "math-verify[antlr4_13_2]==0.9.0",
]
posttrain = [
  "laya==0.3.29",
  "peft==0.18.1",
  "torch==2.9.1",
  "transformers==4.57.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

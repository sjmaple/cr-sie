name: train-a-router-encoder

services:
  encoder:
    # This is a locally built tag, not a published SIE image.
    image: train-a-router-encoder:975d5309
    platform: linux/amd64
    build:
      context: https://github.com/superlinked/sie.git#975d5309ba3af9eaeb13725b20dcf10d906c3e2a
      dockerfile: packages/sie_server/Dockerfile.cuda12
      args:
        BUNDLE: sglang-embedding
        SIE_SRC_REV: 975d5309ba3af9eaeb13725b20dcf10d906c3e2a
    restart: "no"
    shm_size: 8gb
    environment:
      SIE_AUTH_MODE: none
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./models:/app/models:ro
      - ./check_encoder.py:/opt/check_encoder.py:ro
      - encoder-cache:/app/.cache
    ports:
      - "127.0.0.1:8000:8080"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --models-dir
      - /app/models
      - --models
      - Qwen/Qwen3-Embedding-4B
      - --preload
      - Qwen/Qwen3-Embedding-4B
      - --device
      - cuda
    healthcheck:
      test: [CMD, python, /opt/check_encoder.py]
      interval: 10s
      timeout: 10s
      start_period: 10m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ENCODER_GPU:-0}"]
              capabilities: [gpu]

volumes:
  encoder-cache:

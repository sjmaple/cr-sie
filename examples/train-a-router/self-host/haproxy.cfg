global
    maxconn 16
    tune.bufsize 147456
    tune.http.maxhdr 32
    tune.lua.bool-sample-conversion normal
    lua-load /usr/local/etc/haproxy/chat-model.lua

defaults
    mode http
    timeout connect 5s
    timeout client 360s
    timeout server 360s
    timeout http-request 5s
    timeout http-keep-alive 5s
    retries 0

frontend local_sie
    bind 127.0.0.1:8080
    acl get method GET
    acl post method POST
    acl chat path -m str /v1/chat/completions
    acl encode path -m str /v1/encode/Qwen/Qwen3-Embedding-4B
    acl cheap_metadata path -m str /v1/models/Qwen/Qwen3.5-4B
    acl strong_metadata path -m str /v1/models/Qwen/Qwen3.8-27B-FP8
    acl encoder_metadata path -m str /v1/models/Qwen/Qwen3-Embedding-4B
    http-request deny deny_status 400 if { query -m found }
    http-request deny deny_status 431 if { req.hdrs -m len gt 8192 }
    http-request deny deny_status 400 if { req.hdr(transfer-encoding) -m found }
    http-request deny deny_status 400 if { req.hdr(content-encoding) -m found }
    http-request deny deny_status 400 if { req.hdr(expect) -m found }
    http-request deny deny_status 404 unless get or post
    http-request deny deny_status 404 if get !cheap_metadata !strong_metadata !encoder_metadata
    http-request deny deny_status 404 if post !chat !encode
    http-request deny deny_status 400 if get { req.hdr(content-length) -m found }
    http-request deny deny_status 400 if post !{ req.hdr_cnt(content-length) eq 1 }
    http-request deny deny_status 413 if post { req.hdr(content-length) -m int gt 131072 }
    http-request deny deny_status 400 if chat !{ req.hdr(content-type) -m str application/json }
    http-request deny deny_status 400 if encode !{ req.hdr(content-type) -m str application/json application/msgpack application/x-msgpack }
    http-request wait-for-body time 2s if post
    http-request lua.validate-body chat if post chat
    http-request lua.validate-body encode if post encode
    http-request deny deny_status 400 if post !{ var(txn.valid_body) -m bool }
    http-request del-header Authorization
    http-request del-header Proxy-Authorization
    http-request del-header X-API-Key
    http-request del-header Cookie
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    use_backend cheap if cheap_metadata
    use_backend strong if strong_metadata
    use_backend encoder if encoder_metadata
    use_backend encoder if encode
    use_backend cheap if { var(txn.model) -m str Qwen/Qwen3.5-4B }
    use_backend strong if { var(txn.model) -m str Qwen/Qwen3.8-27B-FP8 }

backend cheap
    server worker 127.0.0.1:18081

backend strong
    server worker 127.0.0.1:18082

backend encoder
    server worker 127.0.0.1:18083
